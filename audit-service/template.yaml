AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 15
    Runtime: nodejs18.x
    MemorySize: 128
    Environment:
      Variables:
        TABLE_NAME: !Ref AuditTable

Resources:
  AuditTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    Properties:
      TableName: AuditLogs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: logType
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: logType
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  AuditQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: AuditServiceQueue
      MessageRetentionPeriod: 345600
      VisibilityTimeout: 30
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AuditDLQ.Arn
        maxReceiveCount: 3

  AuditQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref AuditQueue
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              # добавить id аккаунта Михаила
              AWS: "arn:aws:iam::ID_Михаила:root"
            Action: "sqs:SendMessage"
            Resource: !GetAtt AuditQueue.Arn

  AuditDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: AuditServiceDLQ
      MessageRetentionPeriod: 1209600

  WriterFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
    Properties:
      CodeUri: .
      Handler: src/writer.handler
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt AuditQueue.Arn
            BatchSize: 10
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref AuditTable

  ReaderFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
    Properties:
      CodeUri: .
      Handler: src/reader.handler
      Events:
        GetLogsCall:
          Type: Api
          Properties:
            Path: /logs
            Method: get
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref AuditTable

Outputs:
  WebEndpoints:
    Description: "Api Gateway endpoint"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/logs/"